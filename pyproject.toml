[project]
name = "fundedhere-etl"
version = "1.0.0"
description = "FundedHere reconciliation ETL pipeline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
fundedhere-etl = "fundedhere_etl.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
